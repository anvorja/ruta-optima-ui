name: CI

# CI on every PR to main/develop and on pushes to them. The rulesets require the two job
# names below ("Calidad y build", "Imagen Docker") as status checks: keep them in sync.
# No secrets are used: the app is a static SPA with no environment variables.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Calidad y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Formato (prettier)
        run: pnpm format:check
      - name: Análisis de tipos (tsc)
        run: pnpm typecheck
      - name: Lint (eslint)
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Auditoría de dependencias de producción
        run: pnpm audit --prod --audit-level=high

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ruta-optima-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prueba de humo (la imagen arranca, /healthz y rutas del SPA responden)
        run: |
          docker run -d --name web -p 8080:8080 ruta-optima-dashboard:ci
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz >/dev/null; then
              curl -sf http://localhost:8080/live-map | grep -q '<div id="root">' && exit 0
            fi
            sleep 1
          done
          docker logs web
          exit 1
